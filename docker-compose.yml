# ./start.sh                        first run: creates .env, builds, starts → http://localhost:8790
# ./reset-password.sh <username>    set a new password for a console user
# docker compose logs -f zealead  follow the server log
services:
  zealead:
    build: .
    image: zealead:latest
    container_name: zealead
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    # Pinned here so values in .env (meant for running without Docker) can't move the
    # database or the listener inside the container.
    environment:
      ZEALEAD_DB: /app/data/zealead.db
      ZEALEAD_KEYS_DIR: /app/keys
      ZEALEAD_BIND_ADDR: 0.0.0.0
      ZEALEAD_PORT: "8790"
    ports:
      # Loopback only by default. To reach it from other machines, put a TLS reverse proxy
      # in front, or set ZEALEAD_PUBLISH_ADDR=0.0.0.0 in .env if you accept the risk.
      - "${ZEALEAD_PUBLISH_ADDR:-127.0.0.1}:${ZEALEAD_PUBLISH_PORT:-8790}:8790"
    volumes:
      - zealead-data:/app/data # SQLite: tasks, leads, sessions, users
      - zealead-keys:/app/keys # session signing key
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8790/api/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  zealead-data:
  zealead-keys:

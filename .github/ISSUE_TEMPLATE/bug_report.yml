name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please remove API keys, tokens and other people's personal data from logs before posting. Report security issues privately: see SECURITY.md."
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: "1. zealead run brief.yaml\n2. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `zealead --version`
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options: [CLI, Web console, Docker, A connector, Other]
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Run with `-v` for more detail.
      render: text
